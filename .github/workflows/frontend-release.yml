name: Application Frontend Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Get version"
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Build Endurist Web UI Image
        run: docker build . --file frontend/Dockerfile --tag marzavin/endurist-ui:${{ env.RELEASE_VERSION }}

      - name: Tag Endurist Web UI Image as 'latest'
        run: docker tag marzavin/endurist-ui:${{ env.RELEASE_VERSION }} marzavin/endurist-ui:latest

      - name: Docker Login
        run: docker login -u="${{ secrets.DOCKER_LOGIN }}" -p="${{ secrets.DOCKER_PASSWORD }}"

      - name: Push Endurist Web UI Image
        run: docker image push marzavin/endurist-ui:${{ env.RELEASE_VERSION }}

      - name: Push Endurist Web UI Image (latest)
        run: docker image push marzavin/endurist-ui:latest
