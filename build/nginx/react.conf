server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------
    # GZIP
    # ----------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ----------------------------
    # Security headers
    # ----------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # ----------------------------
    # Static assets (долгий кеш)
    # ----------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------
    # SPA fallback (ВАЖНО для React Router)
    # ----------------------------
    location / {
        try_files $uri /index.html;
    }

    # ----------------------------
    # Optional: healthcheck endpoint
    # ----------------------------
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}